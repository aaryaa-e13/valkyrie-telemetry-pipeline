# Project VALKYRIE - Docker Compose
#
# Services without a `profiles:` key are "core" and always start.
# Heavier services get a profile so they only start when asked, e.g.
#   docker compose --profile spark up -d
# This keeps memory use low on a 10 GB WSL2 laptop.
#
# Every value has a default (${VAR:-default}), so this works without a .env file.

name: valkyrie

services:
  # ---------------------------------------------------------------------------
  # Kafka broker in KRaft mode (no ZooKeeper). One node acts as both the
  # broker (stores messages) and the controller (manages cluster metadata).
  # ---------------------------------------------------------------------------
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.2}
    container_name: valkyrie-kafka
    hostname: kafka
    ports:
      # Host port -> EXTERNAL listener, for tools running on your laptop.
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # Fixed cluster id so the data volume is reused across restarts
      # (a new id would not match the already-formatted storage).
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Three listeners:
      #   INTERNAL  kafka:29092     -> other containers (Spark, simulator)
      #   EXTERNAL  localhost:9092  -> your laptop
      #   CONTROLLER kafka:9093     -> KRaft controller traffic only
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker => internal topics can only have 1 replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics must be created explicitly (see kafka-init) so partition count
      # and retention are deliberate, not accidental defaults.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # JVM heap cap; container limit below leaves headroom for off-heap memory.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}
    healthcheck:
      # Healthy once the broker answers API requests on its internal listener.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot job: create topics, verify their config, then exit.
  # Safe to re-run (idempotent).
  # ---------------------------------------------------------------------------
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.2}
    container_name: valkyrie-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ${TOPIC_NAME:-game-events}
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-6}
      TOPIC_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR:-1}
      TOPIC_RETENTION_MS: ${TOPIC_RETENTION_MS:-604800000}  # 7 days
    volumes:
      - ./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["sh", "/scripts/create-topics.sh"]
    mem_limit: 512m
    restart: "no"

  # ---------------------------------------------------------------------------
  # Event simulator (profile: sim). One-shot: generates a run, sends it, writes
  # the manifest to ./manifests, then exits. Usage:
  #   docker compose --profile sim run --rm simulator --config simulator/config.tiny.yaml
  # ---------------------------------------------------------------------------
  simulator:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
    image: valkyrie-simulator:dev
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Inside the Docker network we use the INTERNAL listener, not localhost.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ${TOPIC_NAME:-game-events}
      LOG_LEVEL: ${SIM_LOG_LEVEL:-INFO}
    volumes:
      # Long syntax with create_host_path: false -> fail loudly if the folder is
      # missing, instead of Docker silently creating it owned by root.
      # `make dirs` creates it with your user.
      - type: bind
        source: ./manifests
        target: /app/manifests
        bind:
          create_host_path: false
    mem_limit: 256m
    restart: "no"

  # ---------------------------------------------------------------------------
  # Spark Structured Streaming: Kafka -> raw Parquet (profile: spark).
  # Local mode inside one container: driver + executors share one JVM.
  # Memory: 2g JVM heap + ~1g headroom (off-heap, metaspace, Python) = 3g limit.
  # ---------------------------------------------------------------------------
  spark:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: valkyrie-spark:dev
    container_name: valkyrie-spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPARK_MASTER: ${SPARK_MASTER:-local[4]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ${TOPIC_NAME:-game-events}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-10 seconds}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-50000}
      RAW_OUTPUT_PATH: /data/lake/raw/game_events
      RAW_CHECKPOINT_PATH: /data/checkpoints/raw_to_parquet
      STATUS_PATH: /data/status/raw_to_parquet.json   # last committed batch (for tests)
      LOG_LEVEL: ${SPARK_JOB_LOG_LEVEL:-INFO}
    volumes:
      # Parquet output + checkpoints (git-ignored). See simulator for why long syntax.
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      # Run manifests, read-only, for verify_manifest.
      - type: bind
        source: ./manifests
        target: /app/manifests
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"         # Spark UI: http://localhost:4040
    mem_limit: ${SPARK_MEM_LIMIT:-3g}
    init: true                                # forwards SIGTERM so the job stops cleanly
    stop_grace_period: 60s                    # time to finish/abort the current batch
    restart: "no"

  # ---------------------------------------------------------------------------
  # One-shot Spark tools, e.g. verify_manifest (profile: tools). Same image as
  # `spark`, but separate so it can run NEXT TO the streaming job:
  #   - no container_name / ports  -> no clash with valkyrie-spark or :4040
  #   - no depends_on kafka         -> reads Parquet only
  #   - ./data is READ-ONLY         -> a verify bug cannot damage the lake or
  #                                    the checkpoint (proved in D1.16)
  #   - Spark scratch space lives in the container's own /tmp, not on the host
  # Usage: docker compose --profile tools run --rm -T spark-tools python -m ...
  # ---------------------------------------------------------------------------
  spark-tools:
    profiles: ["tools"]
    image: valkyrie-spark:dev                 # built by `make spark-build`
    pull_policy: never                        # never try Docker Hub for a local image
    environment:
      SPARK_LOCAL_DIRS: /tmp/spark-local
      LOG_LEVEL: INFO
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./manifests
        target: /app/manifests
        read_only: true
        bind:
          create_host_path: false
    mem_limit: ${SPARK_TOOLS_MEM_LIMIT:-1536m} # verify uses a 1g driver heap
    init: true
    restart: "no"

volumes:
  kafka-data:
